[package]
name = "desk-puff-ble"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[dependencies]
base64 = "0.22.1"
btleplug = "0.12.0"
futures-util = "0.3.31"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tokio = { version = "1.47.1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "time"] }
uuid = "1.18.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
