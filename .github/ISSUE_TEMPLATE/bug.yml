name: Bug report
description: Report a reproducible desk_Puff problem without personal device identifiers.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not post serial numbers, Bluetooth addresses, pairing data, or private packet captures.
  - type: input
    id: version
    attributes:
      label: desk_Puff version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device family and chamber
      placeholder: Peak Pro with 3DXL (no serial number)
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed serial numbers, Bluetooth addresses, pairing data, and secrets.
          required: true
