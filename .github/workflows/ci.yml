name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and safety tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore .\desk_Puff.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format .\desk_Puff.slnx --verify-no-changes --no-restore

      - name: Build with analyzers
        run: dotnet build .\desk_Puff.slnx --configuration Release --no-restore

      - name: Run safety suite
        run: dotnet test .\desk_Puff.slnx --configuration Release --no-build --no-restore

      - name: Publish self-contained smoke artifact
        run: dotnet publish .\src\DeskPuff.App\DeskPuff.App.csproj --configuration Release --no-restore -p:PublishProfile=Windows-x64

      - name: Upload executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desk_Puff-win-x64
          path: artifacts/publish/win-x64/desk_Puff.exe
          if-no-files-found: error
          retention-days: 14
